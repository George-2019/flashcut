org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.daemon=true
org.gradle.caching=false
org.gradle.configureondemand=false
org.gradle.internal.http.connectionTimeout=20000
org.gradle.internal.http.socketTimeout=60000
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# 本机（arm64）使用 Termux 版 aapt2，需关闭 AGP 自带的 aapt2 下载
android.aapt2FromMavenOverride=/root/android/sdk/build-tools/35.0.0/aapt2
